{% extends "base.html" %}
{% block content %}
<div class="head"><h1>{{ 'Editar cliente' if c else 'Nuevo cliente' }}</h1></div>
<form method="post" class="card form-grid">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Código *<input name="code" required value="{{ c.code if c else suggested_code }}"></label>
  <label>Nombre / razón social *<input name="name" required value="{{ c.name if c else '' }}"></label>
  <label>Grupo (zona comercial, instalador, delegación…)<input name="group" value="{{ c.group if c else '' }}"></label>
  <label>Tipo<select name="client_type">{% for t in ['residencial','comercio','empresa','industria','banca','administración','otro'] %}<option {{ 'selected' if c and c.client_type == t }}>{{ t }}</option>{% endfor %}</select></label>
  <label>NIF/CIF<input name="tax_id" value="{{ c.tax_id if c else '' }}"></label>
  <label>Nº contrato<input name="contract_number" value="{{ c.contract_number if c else '' }}"></label>
  <label class="span2">Dirección<input name="address" value="{{ c.address if c else '' }}"></label>
  <label>Código postal<input name="postal_code" value="{{ c.postal_code if c else '' }}"></label>
  <label>Población<input name="city" value="{{ c.city if c else '' }}"></label>
  <label>Provincia<input name="province" value="{{ c.province if c else '' }}"></label>
  <label>País<input name="country" value="{{ c.country if c else 'España' }}"></label>
  <label>Teléfono<input name="phone" value="{{ c.phone if c else '' }}"></label>
  <label>Email<input name="email" type="email" value="{{ c.email if c else '' }}"></label>
  {% if has('clients.secrets') %}
  <label>Palabra clave<input name="keyword" value="{{ c.keyword if c else '' }}"></label>
  <label>Palabra de coacción<input name="duress_keyword" value="{{ c.duress_keyword if c else '' }}"></label>
  {% endif %}
  <label class="full">Instrucciones al operador<textarea name="instructions" rows="4">{{ c.instructions if c else '' }}</textarea></label>
  <label class="full">Notas internas<textarea name="notes" rows="3">{{ c.notes if c else '' }}</textarea></label>
  <label><input type="checkbox" name="active" {{ 'checked' if not c or c.active }}> Cliente activo</label>
  <div class="full"><button class="btn primary">Guardar</button> <a href="{{ '/clients/' ~ c.id if c else '/clients' }}">Cancelar</a></div>
</form>
{% endblock %}
