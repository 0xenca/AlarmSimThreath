{% extends "base.html" %}
{% block content %}
<h1>Perfiles y permisos</h1>
{% for r in roles + [None] %}
<form method="post" action="/roles/save" class="card">
  <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="id" value="{{ r.id if r else '' }}">
  <div class="form-grid">
    <label>Nombre<input name="name" value="{{ r.name if r else '' }}" placeholder="{{ '' if r else 'Nuevo perfil' }}" required></label>
    <label>Descripción<input name="description" value="{{ r.description if r else '' }}"></label>
  </div>
  <div class="perms">
    <label><input type="checkbox" name="perms[]" value="*" {{ 'checked' if r and '*' in r.permissions }}> <b>Todos (administrador)</b></label>
    {% for k, v in PERMISSIONS.items() %}<label><input type="checkbox" name="perms[]" value="{{ k }}" {{ 'checked' if r and k in r.permissions }}> {{ v }} <small class="muted">{{ k }}</small></label>{% endfor %}
  </div>
  <button class="btn primary">{{ 'Guardar' if r else 'Crear perfil' }}</button>
  {% if r %}<span class="muted small">{{ r.users|length }} usuarios</span> <button class="btn danger small" name="delete" value="1" onclick="return confirm('¿Borrar perfil?')">Borrar</button>{% endif %}
</form>
{% endfor %}
{% endblock %}
