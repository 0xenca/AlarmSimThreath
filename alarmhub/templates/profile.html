{% extends "base.html" %}
{% block content %}
<h1>Mi perfil</h1>
{% if user.must_change_password %}<div class="flash warning">Debe cambiar su contraseña antes de continuar.</div>{% endif %}
<form method="post" class="card form-grid">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Nombre completo<input name="full_name" value="{{ user.full_name }}"></label>
  <label>Email<input name="email" type="email" value="{{ user.email }}"></label>
  <label>Teléfono<input name="phone" value="{{ user.phone }}"></label>
  <div></div>
  <label>Contraseña actual<input type="password" name="current_password" autocomplete="current-password"></label>
  <label>Nueva contraseña (mín. 8)<input type="password" name="new_password" autocomplete="new-password"></label>
  <label>Repetir nueva contraseña<input type="password" name="new_password2" autocomplete="new-password"></label>
  <div class="full"><button class="btn primary">Guardar</button></div>
</form>
{% if user.api_key %}<div class="card"><h3>API key</h3><code class="secret">{{ user.api_key }}</code></div>{% endif %}
{% endblock %}
